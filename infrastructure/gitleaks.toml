# Gitleaks configuration.
#
# Without this file the action runs gitleaks' default ruleset, which flags one
# value twice and fails the whole `Secret and dependency scans` job on it. The
# value is a test fixture, and it is high-entropy *on purpose*:
# `AuthSettings._validate_secret` rejects short and placeholder secrets outright,
# so a unit test covering the accept path cannot use "secret" or "changeme" - it
# has to supply something that looks exactly like a real key. That is what trips
# the `generic-api-key` rule.
#
# Allowlisting is by the literal, not by path. A blanket `tests/` exemption would
# also hide a genuine credential pasted into a test, which is a normal way for one
# to leak; naming the value keeps every other secret in those files in scope.
#
# Both hits are the same string, in:
#   tests/nomikos/unit/test_auth_hardening.py                (STRONG_SECRET)
#   tests/nomikos/unit/test_runtime_configuration_security.py (JWT_SECRET setenv)
#
# It has never been a live credential: JWT_SECRET is supplied per environment and
# the settings validator refuses to start on a value shipped in the repository.

[extend]
useDefault = true

# The default ruleset has no rule for a database URI with an inline password, and
# that gap is not theoretical here: `infrastructure/.env` was committed in
# e81a50c (2026-05-21) carrying DATABASE_URL, SYNC_DATABASE_URL and JWT_SECRET,
# and neither the working-tree scan nor the history scan flagged it. The file was
# deleted with the rest of that tree in 784df29 and `.gitignore` covers the path
# now, so the same mistake cannot recur *there* - but nothing was stopping it
# recurring anywhere else.
#
# `infrastructure/.env` is a live path again: the Compose files moved into
# `infrastructure/`, and Compose reads its `.env` from the directory holding
# them. It is the same ignored, never-committed file it was before, and this
# rule is the reason a slip would now be caught rather than repeated.
#
# Scoped deliberately: it fires only when a password is actually present between
# the scheme and the host. `postgresql://localhost/db` and
# `postgresql://postgres@localhost` carry no credential and are not findings; a
# URI is only a leak once it embeds one.
[[rules]]
id = "database-uri-with-password"
description = "Database connection URI with an inline password"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqps?|clickhouse|cockroachdb)(?:\+\w+)?://[^\s:/@]+:[^\s/@]+@[^\s/]+'''
keywords = [
  "postgres",
  "postgresql",
  "mysql",
  "mariadb",
  "mongodb",
  "redis",
  "rediss",
  "amqp",
  "amqps",
  "clickhouse",
  "cockroachdb",
]

[[rules.allowlists]]
description = """
Three shapes that match the pattern without carrying a credential.

1. Template placeholders. The `.env.*.example` files interpolate
   `${NOMIKOS_DATABASE_PASSWORD}` where the password goes; a `${...}` in that
   position is the absence of a secret, not one.
2. Angle-bracket and obvious-word placeholders, the other way the same files and
   the deployment docs spell "put yours here".
3. Local throwaway credentials published on purpose - the integration suite and
   docker-compose both hard-code postgres/dev on 127.0.0.1:5433. Since
   tests/nomikos/integration/conftest.py now refuses any host that is not
   loopback, these strings cannot name a real database.

Matched by the literal shape, never by path, so a genuine credential pasted into
any of those same files is still a finding.
"""
regexes = [
  '''://[^\s:/@]+:\$\{[^}]*\}@''',
  '''://[^\s:/@]+:\$[A-Za-z_][A-Za-z0-9_]*@''',
  '''://[^\s:/@]+:<[^>]*>@''',
  '''(?i)://[^\s:/@]+:(?:password|changeme|placeholder|your[-_]?password|replace[-_a-z]*)@''',
  # Loopback. A credential that only works from this machine is not a leak, and
  # the guard tests need real-looking local URLs to assert the accept path.
  '''://[^\s:/@]+:[^\s/@]+@(?:localhost|127\.0\.0\.1|\[::1\])''',
  # Fabricated remote hosts, used by the guard tests to assert the *refuse*
  # path. They have to look like the real thing or the tests prove nothing.
  # Named individually: an alphabet-run subdomain is not a host anyone owns.
  '''://[^\s:/@]+:[^\s/@]+@db\.abcdefghijk[a-z]*\.supabase\.co''',
  '''://[^\s:/@]+:[^\s/@]+@db\.internal(?:[:/]|\b)''',
]

[allowlist]
description = "Shared test literals and scanner false positives"

# Matched against the whole source line, not just the captured secret.
#
# This is not cosmetic. `regexTarget` defaults to "secret", and against a secret
# the anchored `tokenizer=` entry below could never match: gitleaks captures
# `gpt_syriac_500`, so the `^...=...$` shape had nothing to bind to and the
# entry sat here doing nothing. Matching the line is also what the entries
# actually mean - it is the *assignment* that proves the value is a config key
# or a placeholder, and a bare high-entropy string on its own proves nothing.
regexTarget = "line"

regexes = [
  # A literal, so it allowlists on any target. See the header: one test fixture,
  # high-entropy on purpose because the accept path cannot be tested without it.
  '''xQ7v2Kd9RmZ4pB6wLt1yHs3nCf8jUa5eG0oV''',
  # A Hydra config key, not a credential: `tokenizer=gpt_syriac_500` names a
  # tokenizer checked into this repository.
  '''(?m)^\s*tokenizer=gpt_syriac_500(?:\s*\\)?\s*$''',
  # "replace-..." is how every shipped `.env.*.example` spells "put yours here",
  # and `AuthSettings._validate_secret` refuses to boot on a value starting that
  # way - so this shape is a secret's absence, the same argument the URI
  # allowlist above makes for `${...}` and `<...>`. By shape, never by path: a
  # real credential pasted into those same templates is still a finding.
  #
  # Deliberately case-sensitive on the value, and hyphens only. Case-insensitive
  # with `_` allowed, `replacement_for_the_old_key_xK9mP2vQ8wL4nR7t` reads as a
  # placeholder and walks straight past the scanner. Every placeholder actually
  # shipped here is lowercase-and-hyphens, so requiring that costs nothing and
  # closes the prefix as an evasion.
  '''^\s*[A-Z][A-Z0-9_]*(?:SECRET|KEY|TOKEN|PASSWORD)\s*=\s*replace[a-z0-9-]*\s*$''',
]

# Compiled bytecode, not source. `__pycache__` is gitignored, so nothing here
# can reach a commit and neither `gitleaks git` nor `protect --staged` ever sees
# it; the exclusion only stops a full-directory scan reporting a string that a
# tracked test file already accounts for.
paths = [
  '''(^|/)__pycache__/''',
]

default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff correctness checks
        # `ruff check .` rather than a path list, so a new top-level package is
        # linted by default. Vendored and generated trees are excluded in
        # pyproject.toml (tool.ruff.extend-exclude).
        entry: uv run --locked --group dev ruff check . src/model/inference_export
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      # src/experiments/trOCR.ipynb once carried ~42 MB of committed cell
      # outputs. Strip outputs before they reach a commit; code cells are
      # untouched.
      - id: nbstripout
        name: Strip Jupyter notebook outputs
        entry: uv run --locked --group dev nbstripout
        language: system
        types: [jupyter]

      # `protect --staged`, not `detect`: `detect` rescans the whole working
      # tree (~578 MB here), which would make every commit unusably slow.
      # `infrastructure/gitleaks.toml` is the same config CI's gitleaks-action
      # reads, via GITLEAKS_CONFIG in .github/workflows/security.yml.
      - id: gitleaks
        name: Scan staged changes for secrets
        entry: gitleaks protect --staged --config infrastructure/gitleaks.toml
        language: system
        pass_filenames: false

      - id: ruff-format
        name: Ruff formatting
        entry: uv run --locked --group dev ruff format
        language: system
        types_or: [python, pyi]
        files: ^(nomikos/backend|nomikos_inference|scripts/platform|tests/nomikos|tests/inference|tests/export|tests/hf|src/model/inference_export)/

      - id: frontend-eslint
        name: Frontend ESLint checks
        entry: npm --prefix nomikos/frontend run lint
        language: system
        files: ^nomikos/frontend/.*\.(?:[cm]?[jt]sx?)$
        pass_filenames: false

      - id: frontend-prettier
        name: Frontend Prettier formatting
        entry: npm --prefix nomikos/frontend exec -- prettier --write
        language: system
        files: ^nomikos/frontend/.*\.(?:[cm]?[jt]sx?|json|css|html|md|ya?ml)$

      # When Platform API routes/schemas change, refresh openapi.json + schema.d.ts
      # so commits cannot drift from CI `check:api`. Uses non-production secrets
      # only to instantiate the FastAPI app for schema export.
      - id: openapi-generate
        name: Regenerate OpenAPI client artifacts
        entry: >-
          env
          JWT_SECRET=test-secret-not-for-production-at-least-32-bytes
          INFERENCE_WEBHOOK_SECRET=test-inference-webhook-secret
          npm --prefix nomikos/frontend run generate:api
        language: system
        files: ^(nomikos/backend/.*\.py|scripts/platform/export_openapi\.py)$
        pass_filenames: false

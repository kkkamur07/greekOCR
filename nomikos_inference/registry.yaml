# The three Calamari transcribe entries below were trained and published
# together, so they share one architecture: CNN, then *two* stacked
# bidirectional LSTMs (config key `lstm_layers: 2`, state-dict indices
# `layers.4` and `layers.6`), line height 48, blank index 0, temperature -1.0,
# checkpoint format `calamari-pytorch-v1`. The runtime does not branch on any
# of that. It opens `best.onnx` and reads codec, line height and blank index
# out of the graph's own `metadata_props`, which is why a deeper recurrent
# stack needs no adapter change and no new registry field. The depth is
# recorded here because it is what makes the Syriac pin below a different
# model rather than a re-export of the old one.
# All three were trained by the in-house PyTorch trainer, and the runtime feeds
# the graph exactly what that trainer's loader fed it: grayscale, an
# aspect-preserving bilinear resize to the graph's line height, raw uint8, no
# inversion, no dewarp, no tensor padding, and one crop function for all three:
# the training exporter's `crop_polygon`, a polygon mask on a white canvas
# (`line_crop: polygon-white`). What the three do differ on is how far that crop
# was widened before masking, so each entry declares its own
# `line_crop_padding`: the Greek finetuning crops were exported with 0 px while
# Armenian and Syriac used 12 (ADR 0007). The
# `preprocessing` string in the ONNX metadata of the artifacts pinned below reads
# `existing Calamari NumPy preprocessing`; that is a stale label left by an
# earlier exporter, not an instruction the runtime follows.
models:
  syriac-calamari-v2:
    task: transcribe
    architecture: calamari
    device: cpu
    host_eligibility: local
    # Pinned to the training exporter's own PADDING. Not measured end to end:
    # the Syriac model reproduces no ground truth we hold under any padding
    # (EastSyriac Chapter4, 0/504 exact, CER 0.29 against the card's own test
    # CER 0.21; its charset has no ASCII full stop or colon, which 490 of the
    # 504 lines contain). Serving equals the trainer on those crops line for
    # line, so this is the exporter's PADDING, not a measured value. ADR 0007.
    line_crop: polygon-white
    line_crop_padding: 12
    versions:
      stable:
        weights_source: hf://nomikos-project/syriac-htr-calamari@stable
        # Repointed at a NEW model. What stood here was
        # hub_revision 5ff715e873f1ae3f325ebea4d2c4a95eb5094601 with
        # artifact_sha256 3cb01b58be5809032318c717c079a5b681a87074a372ea4334b9767c67ce301c,
        # a single-BiLSTM checkpoint. That revision still resolves and still
        # holds its own best.onnx, so production kept transcribing off it while
        # this entry sat one model behind: the pin went stale, it never broke.
        # Nothing about the move is a fix to the old artifact.
        # Test CER 0.210 over a 71-character codec.
        # ADR 0006 moved the digest off the native checkpoint, so what is
        # pinned here is the digest of best.onnx and never of best.pt. Both
        # fields are supplied together or not at all for an hf:// source.
        hub_revision: a19a2368fe7d9e607a71b7817f0cac819a91320a
        artifact_sha256: f890eb1a46a51dd7c93636f74d5ceb2831676bd64311ece8c719df12980514a4

  greek-calamari-v1:
    task: transcribe
    architecture: calamari
    device: cpu
    host_eligibility: local
    # Whole Grec1360 corpus, 204 lines, 2026-09-07: 0/204 exact at padding 12
    # (CER 0.304) against 125/204 exact at padding 0 (CER 0.050). The Greek
    # finetuning crops were exported with no padding.
    line_crop: polygon-white
    line_crop_padding: 0
    versions:
      stable:
        weights_source: hf://nomikos-project/greek-htr-calamari@stable
        # This entry stood commented out under a note saying the Hub repo 404s.
        # nomikos-project/greek-htr-calamari exists now, published alongside the
        # other two, so the note is deleted rather than updated.
        # Test CER 0.226 over a 259-character codec, by far the widest of the
        # three: polytonic Greek spends most of that codec on accent and
        # breathing combinations the other two scripts do not have.
        hub_revision: f281965c2828df55f1b59cea70485cbec345bf86
        artifact_sha256: ad92239e4c66096c833ae70c756529212adf10472fbe3ce1b558baa18a24006b

  armenian-calamari-v1:
    task: transcribe
    architecture: calamari
    device: cpu
    host_eligibility: local
    # Full MS_UCLA_MS document, 2026-09-07: 664/819 lines exact at padding 12.
    line_crop: polygon-white
    line_crop_padding: 12
    versions:
      stable:
        weights_source: hf://nomikos-project/armenian-htr-calamari@stable
        # Test CER 0.072 over a 96-character codec, the lowest of the three by a
        # wide margin. Read it as a statement about the training data as much as
        # about the script: the Armenian ground truth is the set that went
        # through a full baseline-pairing pass against the Transkribus XML.
        hub_revision: ed5d74237509a88ab70a9b84fd130b867c9da609
        artifact_sha256: 70f1f652bcbe2bc82d447081f719cd9a340e438e68212334f53fd24e2c51e34d

  blla-segment:
    task: segment
    architecture: blla
    device: cpu
    host_eligibility: local
    versions:
      stable:
        weights_source: hf://nomikos-project/segmentation-blla@stable
        # A NEW revision, unlike Calamari's. The blla.onnx published at
        # 444d51dd predated the exporter's staged GroupNorm reduction, so it
        # carried onnxruntime's flat group reduction and drifted the logits by
        # up to 1.5e-01 against the Torch graph - enough to restructure the
        # polygons of the shortest lines on a page (min IoU 0.73). Re-exported
        # and re-published 2026-08-05; the same page now agrees on 34/34
        # baselines at min IoU 1.00. See ADR 0006.
        hub_revision: 5c20a584b39988a25dfc682f9fe634ac1b4a42dd
        artifact_sha256: d3e9c086541157a2f55209bc4802206478231e7637c12ee4884504f94d6c4ed3

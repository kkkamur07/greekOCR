name: trocr-encoder-decoder-ablation
project: OCR
entity: personal-space-astha
method: grid

metric:
  name: eval/cer
  goal: minimize

program: src.train.trocr
command:
  - ${env}
  - ${interpreter}
  - -m
  - src.train.trocr
  - wandb.enabled=true
  - wandb.name=null
  - training.epochs=40
  - training.checkpoint_top_k=1

parameters:
  experiment:
    values:
      - base_random_full
      - base_pretrained_decoder
      - base_pretrained_lora
      - base_pretrained_full
      - base_random_lora

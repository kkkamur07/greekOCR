defaults:
  - training: default
  - encoder: small
  - optimizer: default
  - logging: default
  - logging@wandb: wand
  - output: local
  - tokenizer: gpt_new
  - decoder: decoder
  - lora_adaptors: lora
  - augmentation: default
  - evaluation: default
  - preparation: default
  - _self_

data:
  dir: data/trocr_processed/combined/pretraining

sweep:
  experiments:
    small_random_full:
      encoder.name: small
      model.name: microsoft/trocr-small-handwritten
      model.checkpoint_dir: trocr_checkpoints/trocr-small-handwritten
      model.freeze_encoder: false
      decoder.reinitialize: all
      lora_adaptors.enabled: false
    small_pretrained_decoder:
      encoder.name: small
      model.name: microsoft/trocr-small-handwritten
      model.checkpoint_dir: trocr_checkpoints/trocr-small-handwritten
      model.freeze_encoder: true
      decoder.reinitialize: token_layers
      lora_adaptors.enabled: false
    small_pretrained_lora:
      encoder.name: small
      model.name: microsoft/trocr-small-handwritten
      model.checkpoint_dir: trocr_checkpoints/trocr-small-handwritten
      model.freeze_encoder: true
      decoder.reinitialize: token_layers
      lora_adaptors.enabled: true
    small_pretrained_full:
      encoder.name: small
      model.name: microsoft/trocr-small-handwritten
      model.checkpoint_dir: trocr_checkpoints/trocr-small-handwritten
      model.freeze_encoder: false
      decoder.reinitialize: token_layers
      lora_adaptors.enabled: false
    small_random_lora:
      encoder.name: small
      model.name: microsoft/trocr-small-handwritten
      model.checkpoint_dir: trocr_checkpoints/trocr-small-handwritten
      model.freeze_encoder: true
      decoder.reinitialize: all
      lora_adaptors.enabled: true
    base_random_full:
      encoder.name: base
      model.name: microsoft/trocr-base-handwritten
      model.checkpoint_dir: trocr_checkpoints/trocr-base-handwritten
      model.freeze_encoder: false
      decoder.reinitialize: all
      lora_adaptors.enabled: false
    base_pretrained_decoder:
      encoder.name: base
      model.name: microsoft/trocr-base-handwritten
      model.checkpoint_dir: trocr_checkpoints/trocr-base-handwritten
      model.freeze_encoder: true
      decoder.reinitialize: token_layers
      lora_adaptors.enabled: false
    base_pretrained_lora:
      encoder.name: base
      model.name: microsoft/trocr-base-handwritten
      model.checkpoint_dir: trocr_checkpoints/trocr-base-handwritten
      model.freeze_encoder: true
      decoder.reinitialize: token_layers
      lora_adaptors.enabled: true
    base_pretrained_full:
      encoder.name: base
      model.name: microsoft/trocr-base-handwritten
      model.checkpoint_dir: trocr_checkpoints/trocr-base-handwritten
      model.freeze_encoder: false
      decoder.reinitialize: token_layers
      lora_adaptors.enabled: false
    base_random_lora:
      encoder.name: base
      model.name: microsoft/trocr-base-handwritten
      model.checkpoint_dir: trocr_checkpoints/trocr-base-handwritten
      model.freeze_encoder: true
      decoder.reinitialize: all
      lora_adaptors.enabled: true

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null

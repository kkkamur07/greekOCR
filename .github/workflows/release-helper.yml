name: Release Inference Helper

# Builds the native Inference Helper installers on each OS's own runner
# (PyInstaller cannot cross-compile) and uploads the artifacts to the
# matching, already-published GitHub Release. Trigger by publishing a release
# for an `inference-helper-v*` tag or manually against an existing release tag.
#
# Every third-party action below is pinned to a full commit SHA. This job holds
# `contents: write` and publishes the binaries researchers download, so a
# mutable tag here is a direct code-execution path into signed releases.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach artifacts to (e.g. inference-helper-v0.1.4)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-helper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.inputs.tag || github.event.release.tag_name, 'inference-helper-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller builds must run on the architecture they package.
          - os: macos-15
            artifact: nomicous-inference-helper-macos.dmg
            build: MACOS_ARCH=arm64 bash packaging/helper/macos/build-dmg.sh
            signing: macos
          - os: macos-15-intel
            artifact: nomicous-inference-helper-macos-intel.dmg
            build: MACOS_ARCH=x86_64 bash packaging/helper/macos/build-dmg.sh
            signing: macos
          # Build against an older glibc so the PyInstaller bundle works on
          # more supported Linux distributions.
          # Linux has no OS code-signing equivalent; the tarball is covered by
          # the (mandatory) build provenance attestation and the signed
          # SHA256SUMS manifest produced by the release job.
          - os: ubuntu-22.04
            artifact: nomicous-inference-helper-linux.tar.gz
            build: bash packaging/helper/linux/build-tarball.sh
            signing: none
          - os: windows-latest
            artifact: nomicous-inference-helper-windows.zip
            build: powershell -ExecutionPolicy Bypass -File packaging/helper/windows/build-installer.ps1
            signing: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"

      # packaging/helper/macos/build-dmg.sh and windows/build-installer.ps1 both
      # fall back to an UNSIGNED build with only a warning when the signing
      # material is missing. In CI that is not an acceptable default: a release
      # that silently ships unsigned installers is worse than a failed release.
      # Fail here, before anything is built, when the credentials are absent.
      - name: Require code-signing credentials
        if: matrix.signing != 'none'
        shell: bash
        env:
          SIGNING: ${{ matrix.signing }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          missing=""
          if [ "$SIGNING" = "macos" ]; then
            for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_CODESIGN_IDENTITY; do
              eval "value=\${$name}"
              [ -n "$value" ] || missing="$missing $name"
            done
          elif [ "$SIGNING" = "windows" ]; then
            for name in WINDOWS_SIGNING_CERT_BASE64 WINDOWS_SIGNING_CERT_PASSWORD; do
              eval "value=\${$name}"
              [ -n "$value" ] || missing="$missing $name"
            done
          fi
          if [ -n "$missing" ]; then
            echo "::error::Refusing to publish unsigned installers. Missing repository secrets:$missing"
            exit 1
          fi

      - name: Import macOS signing certificate
        if: matrix.signing == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          certificate="$RUNNER_TEMP/release-signing.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

      - name: Stage Windows signing certificate
        if: matrix.signing == 'windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "release-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          "WINDOWS_SIGNING_CERT=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: bash
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: ${{ matrix.build }}

      - name: Verify artifact exists
        shell: bash
        run: |
          test -f "packaging/helper/dist/${{ matrix.artifact }}" \
            || { echo "Missing packaging/helper/dist/${{ matrix.artifact }}"; ls -la packaging/helper/dist || true; exit 1; }

      # The build scripts warn-and-continue on missing credentials, so also
      # assert after the fact that the shipped bytes really carry a signature.
      - name: Verify macOS signature
        if: matrix.signing == 'macos'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 \
            "packaging/helper/dist/payload/Applications/Nomicous Inference Helper.app"
          codesign --verify --strict --verbose=2 "packaging/helper/dist/${{ matrix.artifact }}"

      - name: Verify Windows signature
        if: matrix.signing == 'windows'
        shell: pwsh
        run: |
          $exe = "packaging/helper/dist/windows-installer/nomicous-inference-helper/nomicous-inference-helper.exe"
          $signature = Get-AuthenticodeSignature -FilePath $exe
          Write-Host "Authenticode status: $($signature.Status)"
          if ($signature.Status -ne "Valid") {
            Write-Error "::error::$exe is not validly signed (status: $($signature.Status))"
            exit 1
          }

      - name: Create artifact checksum
        shell: bash
        run: |
          python - "${{ matrix.artifact }}" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys

          artifact = Path("packaging/helper/dist") / sys.argv[1]
          digest = sha256(artifact.read_bytes()).hexdigest()
          (artifact.parent / f"{artifact.name}.sha256").write_text(
              f"{digest}  {artifact.name}\n",
              encoding="utf-8",
          )
          PY

      # Unconditional. This step used to be guarded on repository visibility,
      # which made provenance best-effort: flipping the repository to private
      # silently downgraded every release to unattested binaries.
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: packaging/helper/dist/${{ matrix.artifact }}

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helper-${{ matrix.artifact }}-${{ github.run_id }}
          path: |
            packaging/helper/dist/${{ matrix.artifact }}
            packaging/helper/dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error
          overwrite: false
          retention-days: 14

  release:
    name: Verify and publish immutable release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Require release manifest signing key
        env:
          RELEASE_SIGNING_GPG_KEY: ${{ secrets.RELEASE_SIGNING_GPG_KEY }}
          RELEASE_SIGNING_GPG_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_GPG_PASSPHRASE }}
        run: |
          missing=""
          [ -n "$RELEASE_SIGNING_GPG_KEY" ] || missing="$missing RELEASE_SIGNING_GPG_KEY"
          [ -n "$RELEASE_SIGNING_GPG_PASSPHRASE" ] || missing="$missing RELEASE_SIGNING_GPG_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Refusing to publish an unsigned checksum manifest. Missing repository secrets:$missing"
            exit 1
          fi
      - name: Download immutable installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: helper-*-${{ github.run_id }}
          path: release-assets
          merge-multiple: true
      - name: Verify checksums and consolidate manifest
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path("release-assets")
          assets = sorted(
              path
              for path in root.iterdir()
              if path.is_file() and not path.name.endswith(".sha256")
          )
          if len(assets) != 4:
              raise SystemExit(f"expected four installer assets, found: {[path.name for path in assets]}")
          lines = []
          for asset in assets:
              expected = (asset.parent / f"{asset.name}.sha256").read_text(encoding="utf-8").strip()
              actual = f"{sha256(asset.read_bytes()).hexdigest()}  {asset.name}"
              if expected != actual:
                  raise SystemExit(f"checksum mismatch for {asset.name}")
              lines.append(actual)
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      # A digest list is only as trustworthy as its origin. Sign SHA256SUMS so a
      # client that pins the release signing key can verify all four installers
      # from one detached signature, including the Linux tarball, which has no
      # OS-level code signature.
      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_GPG_KEY: ${{ secrets.RELEASE_SIGNING_GPG_KEY }}
          RELEASE_SIGNING_GPG_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_SIGNING_GPG_KEY" | base64 --decode | gpg --batch --import
          key_id="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          test -n "$key_id" || { echo "::error::no secret key imported from RELEASE_SIGNING_GPG_KEY"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RELEASE_SIGNING_GPG_PASSPHRASE" \
            --local-user "$key_id" \
            --armor --detach-sign --output release-assets/SHA256SUMS.asc \
            release-assets/SHA256SUMS
          gpg --verify release-assets/SHA256SUMS.asc release-assets/SHA256SUMS
          gpg --armor --export "$key_id" > release-assets/nomicous-release-signing-key.asc
      # The SBOM and the Trivy gate previously pointed at `packaging/helper`,
      # which in a fresh checkout holds only build scripts (no lockfile, no
      # dependency manifest, no binaries). Both therefore produced an empty
      # result and the gate passed unconditionally. Point them at the bytes that
      # actually ship: the extracted Linux bundle plus the exact locked
      # dependency set the PyInstaller freeze installs.
      - name: Assemble real scan inputs
        run: |
          mkdir -p release-scan/linux-bundle
          tar -xzf release-assets/nomicous-inference-helper-linux.tar.gz -C release-scan/linux-bundle
          uv export --locked --no-default-groups --group helper --group packaging \
            --no-hashes -o release-scan/requirements.txt
          echo "scan input tree:"
          du -sh release-scan
          grep -c '^[a-zA-Z]' release-scan/requirements.txt
      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-scan
          format: spdx-json
          output-file: release-assets/nomicous-inference-helper.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Verify the release SBOM is not empty
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(
              Path("release-assets/nomicous-inference-helper.spdx.json").read_text(encoding="utf-8")
          )
          packages = document.get("packages", [])
          names = {package.get("name") for package in packages}
          print(f"SBOM packages: {len(packages)}")
          if len(packages) < 30:
              raise SystemExit(
                  f"release SBOM has {len(packages)} packages; it is not describing the real installer"
              )
          for required in ("torch", "fastapi", "uvicorn"):
              if required not in names:
                  raise SystemExit(f"release SBOM does not mention {required}")
          PY
      - name: Scan helper release artifacts
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: release-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Attest checksum manifest provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: release-assets/SHA256SUMS
      - name: Publish without replacing existing release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          rm -rf release-scan
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" release-assets/*

name: Deployment and Images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-and-docker:
    name: Platform bundle, image, and supply-chain checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true
      # infrastructure/platform/requirements.txt is what Vercel installs; uv.lock is what
      # every other environment installs. Regenerate it with the exact command in
      # its own header and fail if the committed copy differs.
      - name: Verify infrastructure/platform/requirements.txt matches uv.lock
        run: |
          uv export --locked --only-group platform-prod --no-hashes -o infrastructure/platform/requirements.txt
          if ! git diff --exit-code -- infrastructure/platform/requirements.txt; then
            echo "::error file=infrastructure/platform/requirements.txt::Out of sync with uv.lock. Run: uv export --locked --only-group platform-prod --no-hashes -o infrastructure/platform/requirements.txt"
            exit 1
          fi
      - run: bash infrastructure/platform/build.sh
      - run: test -f infrastructure/platform/nomikos/backend/core/app.py
      - run: test -f infrastructure/platform/nomikos_inference/contracts/__init__.py
      - run: test -f infrastructure/platform/nomikos_inference/admission.py
      - run: test -f infrastructure/platform/nomikos_inference/settings.py
      - name: Verify platform contract import surface
        run: |
          PYTHONPATH=infrastructure/platform uv run --locked --group platform python -c \
            "from nomikos_inference.contracts.jobs import JobCallbackRequest; assert JobCallbackRequest"
      - run: docker build --target runtime --tag nomikos-api:ci -f nomikos/Dockerfile .
      # Build and tag the frontend `runner` stage (the image that actually ships)
      # rather than only `builder`, so the scan steps below have a real artifact.
      - run: docker build --target runner --tag nomikos-frontend:ci -f nomikos/frontend/Dockerfile nomikos
      - name: Verify runtime users and import surfaces
        run: |
          test "$(docker run --rm --entrypoint id nomikos-api:ci -u)" != "0"
          docker run --rm \
            -e JWT_SECRET=test-secret-not-for-production-at-least-32-bytes \
            -e ENVIRONMENT=development \
            --entrypoint python nomikos-api:ci \
            -c "from backend.core.main import app; assert app.title"
      - name: Verify health checks
        run: |
          docker image inspect nomikos-api:ci --format '{{json .Config.Healthcheck}}' | jq -e '.Test | length > 0'
      - name: Prepare SBOM output directory
        run: mkdir -p sbom
      - name: Generate API image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: nomikos-api:ci
          format: spdx-json
          output-file: sbom/nomikos-api.spdx.json
          artifact-name: nomikos-api-sbom
          upload-artifact: false
      - name: Generate frontend image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: nomikos-frontend:ci
          format: spdx-json
          output-file: sbom/nomikos-frontend.spdx.json
          artifact-name: nomikos-frontend-sbom
          upload-artifact: false
      # An SBOM pointed at the wrong path still produces a valid, empty document
      # and every downstream gate then passes vacuously. Require real content,
      # and require the runtime dependency we actually care about.
      - name: Verify SBOMs are non-empty
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          # A marker package per image: cheap, and it fails loudly if the SBOM was
          # generated against the wrong reference rather than the built image.
          expected = {
              "sbom/nomikos-api.spdx.json": {"fastapi", "sqlalchemy", "supabase"},
              "sbom/nomikos-frontend.spdx.json": {"next"},
          }
          failed = False
          for relative, markers in expected.items():
              document = json.loads(Path(relative).read_text(encoding="utf-8"))
              packages = document.get("packages", [])
              names = {package.get("name") for package in packages}
              print(f"{relative}: {len(packages)} packages")
              if len(packages) < 20:
                  print(f"::error file={relative}::SBOM has only {len(packages)} packages")
                  failed = True
              for missing in sorted(markers - names):
                  print(f"::error file={relative}::SBOM does not contain {missing}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: Scan API image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nomikos-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan frontend image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nomikos-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Upload image SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-sboms-${{ github.sha }}
          path: sbom/*.spdx.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30

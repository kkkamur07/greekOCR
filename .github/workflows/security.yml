name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scans:
    name: Secret and dependency scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nomikos/frontend/package-lock.json
      - run: npm ci --prefix nomikos/frontend
      - run: npm audit --prefix nomikos/frontend --omit=dev --audit-level=high
      # Remaining pip-audit ignores are owned, time-bounded VEX (not silent CI green):
      # - PYSEC-2026-2132 (Click <8.3.3): the lockfile resolves Click 8.2.1
      #   through typer (via huggingface-hub) and through uvicorn[standard]
      #   (in the inference/platform groups);
      #   docs/security/vex-click-pysec-2026-2132.md
      # - PYSEC-2026-139 (torch, local-only, no fix yet) and CVE-2025-3000 /
      #   PYSEC-2025-194 (torch, local-only, fixed in torch>=2.13.0 but the
      #   `train`/`export` floors have not been raised to it yet):
      #   docs/security/vex-torch-pysec-2026-139-cve-2025-3000.md
      #   `--group export` is included below (ADR 0006 moved Torch there,
      #   out of `[project].dependencies`) so these ignores correspond to
      #   something this scan actually resolves.
      # protobuf CVE-2025-4565 / CVE-2026-0994 are fixed via protobuf>=5.29.6
      # in the inference group (no ignore).
      - run: >-
          uv run --locked --group dev --group platform --group inference --group export pip-audit
          --ignore-vuln PYSEC-2026-139
          --ignore-vuln CVE-2025-3000
          --ignore-vuln PYSEC-2026-2132

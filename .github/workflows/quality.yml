name: Quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, for the ML parity job only - it loads real weights and is far too
    # slow to gate every pull request.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nomikos/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nomikos/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python-lint-unit:
    name: Python lint and unit tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-secret-not-for-production-at-least-32-bytes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true
      # `ruff check .` (not an explicit path list) so a new top-level package is
      # linted by default; vendored/generated trees are in tool.ruff.extend-exclude.
      - run: uv run --locked --group dev ruff check .
      # `src/` is excluded wholesale (research + vendored Calamari), but ADR 0006
      # put code we own inside it: the Torch graphs and the ONNX exporters. Naming
      # the path explicitly overrides the exclusion, so that tree stays linted
      # without reopening the whole research tree.
      - run: uv run --locked --group dev ruff check src/model/inference_export
      # Formatting is a gate, not a suggestion. Without this, `ruff format` drift
      # accumulates silently and every unrelated diff picks up reformatting noise.
      # The path list is not `.`: it must stay identical to the `files:` pattern on
      # the ruff-format pre-commit hook, which deliberately leaves `src/` alone
      # (vendored Calamari fork - reformatting it would fork it from upstream).
      # If the two ever disagree, CI rejects what the hook just produced.
      - run: uv run --locked --group dev ruff format --check nomikos/backend nomikos_inference scripts/platform tests/nomikos tests/inference tests/export tests/hf src/model/inference_export
      # Types. Non-blocking on purpose - mypy was introduced against an untyped
      # codebase, so this reports the error count on every pull request without
      # gating merges. The runtime groups are installed so the check runs against
      # real pydantic/SQLAlchemy/FastAPI types rather than `Any`. Drop
      # `continue-on-error` once the count reaches zero; see [tool.mypy] in
      # pyproject.toml for the order the strictness knobs get turned on.
      - run: uv run --locked --group dev --group platform --group inference mypy nomikos/backend inference
        continue-on-error: true
      - run: uv run --locked --group test --group platform --group inference pytest tests/nomikos/unit tests/inference/unit tests/hf

  postgres-integration:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kalamos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kalamos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/kalamos
      SYNC_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/kalamos
      MIGRATOR_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/kalamos
      JWT_SECRET: test-secret-not-for-production-at-least-32-bytes
      INFERENCE_WEBHOOK_SECRET: test-inference-webhook-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true
      - run: PYTHONPATH=nomikos uv run --locked --group platform alembic -c nomikos/infrastructure/alembic.ini upgrade head
      - run: uv run --locked --group test --group platform --group inference pytest tests/nomikos/integration tests/inference/integration -m "not ml"

  ml-real-weights:
    name: ML real weights
    # The `-m "not ml"` exclusion above is what keeps the integration job fast, but
    # it also means nothing in CI ever exercised the real Calamari/BLLA path - a
    # train/serve preprocessing skew could regress indefinitely without a red build.
    # This job closes that hole. It is deliberately kept off pull requests: it
    # loads the checkpoints under src/hf/staging, which is minutes, not seconds.
    #
    # This used to be the ONNX-vs-Kraken parity job. ADR 0004 left one runtime,
    # so there is nothing to be at parity with; what remains worth running on a
    # schedule is the real graph on the real weights.
    #
    # The trigger is named positively rather than as `!= 'pull_request'`. That
    # negation also matched `push`, so every merge to main paid for a Postgres
    # service, an alembic run and a checkpoint load - which is not what the
    # paragraph above describes, and not what anybody wanted from a job whose
    # whole point is that it is too slow to gate on. Nightly and on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kalamos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kalamos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/kalamos
      SYNC_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/kalamos
      MIGRATOR_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/kalamos
      JWT_SECRET: test-secret-not-for-production-at-least-32-bytes
      INFERENCE_WEBHOOK_SECRET: test-inference-webhook-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true
      - run: PYTHONPATH=nomikos uv run --locked --group platform alembic -c nomikos/infrastructure/alembic.ini upgrade head
      # `tests/nomikos` used to be in this path list and carries no `ml` marker
      # at all - the platform hands a page to an agent, it does not run a model
      # (see the `test-ml` task in pyproject.toml, which already says so). All
      # naming it here bought was collecting the entire platform suite to select
      # nothing out of it.
      - run: uv run --locked --group test --group platform --group inference pytest tests/inference -m ml
      # `tests/export` was listed in `testpaths` but named by no job, so the
      # ONNX-vs-PyTorch parity assertions ran only when a maintainer happened to
      # type `poe test-export`. Those assertions are the only thing standing
      # between a bad export and silently wrong transcriptions - see the note at
      # nomikos_inference/registry.yaml, which records that regression having shipped
      # once - so leaving them un-run was strictly worse than not having them.
      # They belong in this job: it is the other thing here too slow to gate a
      # pull request, and the export tree is the only one that still needs Torch
      # (ADR 0006), which is why this step names `--group export`.
      #
      # Six of the seven export gates compare logits and need only the two
      # checkpoints tracked in git. The seventh - the Calamari graph-vs-artifact
      # gate - is the only one that compares decoded *text*, and it skips unless
      # the published pair is cached under `src/hf/cache/`, which is gitignored.
      # On a clean runner that skip is permanent, so the single most meaningful
      # assertion in the directory would go on not running even after wiring the
      # directory in. Fetch the pair first. The revision is read out of
      # registry.yaml rather than repeated here, so this cannot pin one revision
      # while the runtime resolves another. Public repo, no token, ~12 MB.
      - run: |
          uv run --locked --group inference python - <<'PY'
          import pathlib
          import yaml
          from huggingface_hub import hf_hub_download

          registry = yaml.safe_load(pathlib.Path("nomikos_inference/registry.yaml").read_text())
          pinned = registry["models"]["syriac-calamari-v1"]["versions"]["stable"]
          repo = pinned["weights_source"].removeprefix("hf://").split("@")[0]
          destination = pathlib.Path("src/hf/cache/syriac-calamari-v1/stable")
          destination.mkdir(parents=True, exist_ok=True)
          for artifact in ("best.pt", "best.onnx"):
              hf_hub_download(
                  repo, artifact, revision=pinned["hub_revision"], local_dir=destination
              )
          PY
      - run: uv run --locked --group test --group inference --group export pytest tests/export

  api-contracts:
    name: API contract artifacts
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-secret-not-for-production-at-least-32-bytes
      INFERENCE_WEBHOOK_SECRET: test-inference-webhook-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nomikos/frontend/package-lock.json
      - run: npm ci --prefix nomikos/frontend
      - run: npm run check:api --prefix nomikos/frontend
      # `--group test` is required: the inference group has no pytest, so without
      # it `pytest` resolves from the runner PATH (unpinned, or absent).
      - run: uv run --locked --group test --group inference pytest tests/inference/unit/test_contracts_roundtrip.py

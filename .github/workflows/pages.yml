name: Landing to GitHub Pages

# Publishes landing/ (static marketing site for nomikos.app) to GitHub Pages.
# Replaces the Vercel `nomikos-landing` project. Pages cannot set HTTP
# response headers, so the security headers from landing/vercel.json are
# applied at the Cloudflare edge instead (see docs/deployment/production.md).

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Stage the site
        # vercel.json is Vercel-only; CNAME binds the custom domain; .nojekyll
        # stops Pages from running Jekyll over a plain static tree.
        run: |
          mkdir -p _site
          cp -R landing/. _site/
          rm -f _site/vercel.json _site/README.md
          echo "nomikos.app" > _site/CNAME
          touch _site/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

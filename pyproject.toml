[project]
name = "greekocr"
version = "0.1.0"
description = "OCR and processing for Greek documents"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.24.4,<2",
    # 1.24+ no longer publishes Intel macOS wheels; the helper still ships an
    # x86_64 macOS artifact and PyInstaller cannot cross-compile it.
    "onnxruntime>=1.23.2,<1.24",
    "opencv-python-headless>=4.8,<4.13",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.13.0",
    "jiwer>=4.0.0",
    "pillow>=12.3.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.11.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "nbstripout>=0.8.1",
    "pip-audit>=2.10.1",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.21",
]
# Test runner only. Kept separate (PEP 735 include-group) so a service group can
# pull in the runner without every service group re-declaring pytest, and so the
# production groups can leave it out.
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
# Shared FastAPI/pydantic surface of every Python service in the repo.
service-core = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
]
parity = ["kraken>=7.0.2"]
export = [
    "onnx>=1.17.0",
    "safetensors>=0.5.0",
    "torch>=2.10.0",
]
# Torch-free ONNX runtime shipped inside the frozen Inference Helper.
# Deliberately minimal: anything added here also ships in the signed installers.
helper = [
    { include-group = "service-core" },
    "huggingface-hub>=0.27.0",
    "pillow>=12.3.0",
    # Floor clears CVE-2025-4565 / CVE-2026-0994.
    "protobuf>=5.29.6",
    "scikit-image>=0.25.0",
    "scipy>=1.15.0",
    "shapely>=2.1.0",
    "uvicorn>=0.32.0",
]
# Inference service API (separate container; contracts importable from nomicous).
# The hosted API is the helper runtime plus the job database and OpenCV.
# NOTE: numpy / onnxruntime / opencv-python-headless live in [project].dependencies,
# so this group must be installed with `--group inference`, never `--only-group`.
inference = [
    { include-group = "helper" },
    "opencv-python-headless>=4.8,<4.13",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]
load-testing = [
    "locust>=2.45.0",
]
# Inference Helper native packaging (PyInstaller freeze)
packaging = [
    "pyinstaller>=6.21.0",
    "pillow>=12.3.0",
]
# Production platform image / Vercel bundle (no test runner, no server, no OpenCV)
platform-prod = [
    { include-group = "service-core" },
    "asyncpg>=0.30.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "psycopg2-binary>=2.9.10",
    "PyJWT>=2.10.0",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0.36",
    "pillow>=12.3.0",
    "reportlab>=5.0.0",
    "supabase>=2.13.0",
]
# Nomicous platform API + Postgres + tests (deps only — repo is not installed as a package)
platform = [
    { include-group = "platform-prod" },
    { include-group = "test" },
    "alembic>=1.14.0",
    "opencv-python-headless>=4.8,<4.13",
    "pypdf>=6.13.2",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.poe.tasks]
migrate = { shell = "cd ${NOMICOUS_APP_ROOT:-nomicous} && alembic -c infrastructure/alembic.ini upgrade head" }
serve = { shell = "cd ${NOMICOUS_APP_ROOT:-nomicous} && uvicorn backend.core.main:app --host 0.0.0.0 --port 8000 --workers 1" }
api = { sequence = ["migrate", "serve"] }
inference-api = "uvicorn inference.api.main:app --host 0.0.0.0 --port 8001 --workers 1"
inference-helper = "python -m inference.helper"
inference-worker = "python -m inference.jobs.worker"
# `--group test` is named explicitly on every task: the inference/export groups
# carry no pytest, so omitting it silently falls back to whatever `pytest` is on
# PATH (unpinned) or fails outright.
test-fast = { shell = "uv run --group test --group platform --group inference pytest tests/nomicous/unit" }
test-integration = { shell = "uv run --group test --group platform --group inference pytest tests/nomicous -m integration" }
test-ml = { shell = "uv run --group test --group platform --group inference pytest tests/nomicous -m ml" }
test-inference = { shell = "uv run --group test --group platform --group inference --group export pytest tests/inference" }
test-hf = { shell = "uv run --group test --group inference --group export pytest tests/hf" }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["nomicous", "."]
asyncio_mode = "auto"
testpaths = ["tests/nomicous", "tests/inference", "tests/hf"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:`TorchVGSLModel\\.load_model` is deprecated.*:DeprecationWarning:kraken\\.lib\\.vgsl\\.model",
    "ignore:You will not be able to run predict\\(\\) on this Core ML model.*:RuntimeWarning:coremltools\\.models\\.model",
    "ignore:`blla\\.segment\\(\\)` is deprecated.*:DeprecationWarning:kraken\\.blla",
]
markers = [
    "integration: requires Postgres",
    "ml: runs real Kraken/Calamari weights (slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["nomicous/backend", "inference"]
# CI and pre-commit invoke `ruff check .` so new top-level directories are linted
# by default instead of silently escaping an explicit path list. These trees are
# vendored, generated, or build output. (.venv, dist, and node_modules are
# already in ruff's default excludes.)
extend-exclude = [
    ".lgraph",
    "data",
    "deploy/platform/inference",
    "deploy/platform/nomicous",
    "packaging/helper/build",
    "src/experiments",
]

[tool.ruff.lint]
# F: correctness. I: import sorting. UP: pyupgrade. B: bugbear. SIM: simplify.
select = ["F", "I", "UP", "B", "SIM"]

# ---------------------------------------------------------------------------
# Widening `select` and moving CI to `ruff check .` surfaced 519 pre-existing
# violations, none of them newly introduced. They are recorded here per tree and
# per rule so the new rules are enforced on all new and already-clean code
# instead of the whole ruleset being held back by legacy trees.
#
# This block is debt, not policy: each entry should be fixed and deleted -- with
# one exception. Roughly 385 of the ~533 suppressed violations are in
# `src/model/calamari/`, a VENDORED copy of an upstream package. That debt is
# upstream's, not this project's: fixing it forks us from upstream for no gain.
# Only the remaining ~148 are worth paying down. Do not add rules to this block
# to make a new violation pass. Counts at time of writing:
#   src/model                  385   (also never linted before: F401/F403/F541/F841/F901)
#   nomicous/backend            54
#   tests                       41
#   inference                   12
#   scripts                      9
#   src/preprocessing_data       8
#   nomicous/infrastructure      4
#   src/hf                       4
#   packaging/helper             2
# ---------------------------------------------------------------------------
[tool.ruff.lint.per-file-ignores]
"inference/**" = ["B905", "I001", "SIM109", "SIM114", "UP037"]
"nomicous/backend/**" = ["B008", "B009", "I001", "SIM105", "UP037", "UP042"]
"nomicous/infrastructure/**" = ["I001"]
"packaging/helper/**" = ["I001"]
"scripts/**" = ["I001"]
"src/hf/**" = ["I001"]
"src/model/**" = [
    "B007", "B010", "B023", "B905",
    "F401", "F403", "F541", "F841", "F901",
    "I001",
    "SIM101", "SIM102", "SIM108", "SIM114", "SIM115", "SIM118", "SIM300", "SIM401",
    "UP006", "UP007", "UP008", "UP010", "UP015", "UP018", "UP031", "UP032",
    "UP035", "UP036", "UP045",
]
"src/preprocessing_data/**" = ["B905", "F401", "I001", "SIM102", "UP015"]
"tests/**" = ["B007", "B905", "F401", "I001", "SIM117"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Type checking. The frontend has run `tsc --noEmit` in CI since day one; the
# Python side had nothing, which meant the `# type: ignore` comments scattered
# through the backend were verified by exactly nothing.
#
# This is deliberately NOT `strict = true`, and the CI step deliberately runs
# with `continue-on-error: true`. A checker that turns the build red on day one
# against an untyped codebase gets switched off within a week; one that prints a
# shrinking number every build gets adopted. Tighten the knobs below (and drop
# the continue-on-error) as the count comes down, not before.
#
# Scope is `nomicous/backend` and `inference` only: the service code that ships.
# `src/` (research + vendored Calamari), `scripts/`, and `tests/` are out.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# Bare `mypy` checks the same tree CI does. CI still names the paths explicitly.
files = ["nomicous/backend", "inference"]
# Runtime resolves `backend.*` with `nomicous` on sys.path (see
# tool.pytest.ini_options.pythonpath); mypy needs the same two roots or every
# first-party import inside nomicous/backend reads as missing.
mypy_path = ["nomicous", "."]
namespace_packages = true
explicit_package_bases = true
# Imported-but-unchecked modules are analysed for their types but never report
# errors of their own. This is what keeps the scope above honest: importing the
# vendored tree cannot dump its errors into this build.
follow_imports = "silent"
# Blunt, and intentionally so for the first pass: most runtime deps here ship no
# stubs, and several hundred `import-untyped` lines would bury the real signal.
# Replace with per-module overrides once the baseline is down.
ignore_missing_imports = true
# The one non-default that earns its noise: without it, mypy skips the body of
# every unannotated function, which is most of them, and reports almost nothing.
check_untyped_defs = true
warn_redundant_casts = true
# The point of the exercise: prove the existing `# type: ignore` comments still
# suppress something real.
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
# Off for now. These are the next knobs to turn on, roughly in this order.
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
# Vendored upstream Calamari fork. Excluded explicitly so a future widening of
# `files` cannot pull it in.
exclude = ["^src/model/", "^packaging/helper/build/"]

[[tool.mypy.overrides]]
module = ["src.model.*"]
follow_imports = "skip"
ignore_errors = true

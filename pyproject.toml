# The one published distribution (ADR 0002). It carries the inference library,
# `hf://` weight resolution, and the `nomicous` console entry point; a hosted
# worker installs the same wheel a researcher does, so there is no
# version-compatibility matrix between components that always ship together.
#
# The repository root is the project because the package it publishes lives at
# `inference/`, and a build backend cannot reach outside its own project root.
# `tool.uv.package = false` below keeps development running from the tree: the
# wheel is built explicitly (`uv build`), not installed into every dev venv.
[project]
name = "nomicous-inference"
version = "0.2.0"
description = "Manuscript segmentation and transcription runtime for the nomicous platform"
readme = "inference/README.md"
requires-python = ">=3.11,<3.13"
# [project].dependencies is the closure that reaches a researcher's laptop.
# Anything added here is downloaded by every `uv tool install nomicous-inference`,
# so it is the runtime imports of the shipped modules and nothing else. The
# loopback HTTP surfaces (`inference/api`, `inference/helper`) are excluded from
# the wheel, which is why FastAPI, uvicorn and httpx are absent; they stay in
# the `helper` dependency-group for as long as those modules do (#60).
dependencies = [
    "huggingface-hub>=0.27.0",
    "numpy>=1.24.4,<2",
    "opencv-python-headless>=4.8,<4.13",
    "pillow>=12.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    # The CLI's terminal output (#56). Pure Python, two small dependencies
    # (markdown-it-py, pygments), no compiled extension - it costs a researcher
    # a rounding error next to Torch. It earns its place on the pairing screen:
    # the URL must survive being printed at any width, and the **confirmation
    # code** has to be the most prominent thing on it or ADR 0001's
    # anti-phishing mitigation is decoration again.
    "rich>=13.9.0",
    # ADR 0004: PyTorch is the inference runtime for both architectures. CPU
    # only - see [tool.uv.sources] below, which pins the CPU wheel index on the
    # platforms where PyPI would otherwise serve a CUDA build.
    "safetensors>=0.5.0",
    "scikit-image>=0.25.0",
    "scipy>=1.15.0",
    "shapely>=2.1.0",
    "torch>=2.10.0",
]

[project.scripts]
# ADR 0002: local inference is a CLI, not a loopback service. `pair` and
# `version` shipped in #56; `run` lands in #57 and self-upgrade in #58.
nomicous = "inference.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inference"]
# `inference/api` is the synchronous HTTP inference service and
# `inference/helper` the loopback sidecar. ADR 0002 deletes both (#60); until
# it does, they stay in the repository and out of the wheel. Keeping them out
# is what lets the published closure hold no web server.
exclude = [
    "/inference/api",
    "/inference/helper",
    "/inference/CONTEXT.md",
    # Empty placeholder tree from the pre-Hub weights layout. Weights come from
    # the Hub now and are cached under the researcher's home directory.
    "**/.gitkeep",
]

[tool.hatch.build.targets.sdist]
include = [
    "/inference",
    "/pyproject.toml",
]
exclude = [
    "/inference/api",
    "/inference/helper",
]

[dependency-groups]
# Training stack. A PEP 735 group rather than an optional-dependency extra: the
# root project now publishes `nomicous-inference`, and an extra would make
# `pip install nomicous-inference[train]` a supported way to pull transformers,
# accelerate and torchvision onto a researcher's laptop. Nothing that trains a
# model is part of what runs one. Use `uv run --group train`.
train = [
    "accelerate>=1.13.0",
    "jiwer>=4.0.0",
    "pillow>=12.3.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.11.0",
]
dev = [
    "nbstripout>=0.8.1",
    "pip-audit>=2.10.1",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.21",
]
# Test runner only. Kept separate (PEP 735 include-group) so a service group can
# pull in the runner without every service group re-declaring pytest, and so the
# production groups can leave it out.
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
# Shared FastAPI/pydantic surface of every Python service in the repo.
service-core = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
]
# What the loopback HTTP surfaces (`inference/api`, `inference/helper`) need on
# top of the published runtime. The model runtime itself is no longer listed
# here - it moved to [project].dependencies, which is now the single statement
# of what reaches a researcher. This group is what does *not* reach one, and it
# disappears with those modules in #60.
helper = [
    { include-group = "service-core" },
    # Floor clears CVE-2025-4565 / CVE-2026-0994.
    "protobuf>=5.29.6",
    "uvicorn>=0.32.0",
]
# Inference runtime (contracts importable from nomicous). No Postgres driver and
# no ORM: since ADR 0003 the platform owns the only job queue, and nothing under
# `inference/` touches a database.
# NOTE: the model runtime itself (numpy / torch / pillow / scikit-image / scipy
# / shapely / safetensors / opencv-python-headless / huggingface-hub) lives in
# [project].dependencies, so this group must be installed with
# `--group inference`, never `--only-group`.
inference = [
    { include-group = "helper" },
    "uvicorn[standard]>=0.32.0",
]
load-testing = [
    "locust>=2.45.0",
]
# Inference Helper native packaging (PyInstaller freeze)
packaging = [
    "pyinstaller>=6.21.0",
    "pillow>=12.3.0",
]
# Production platform image / Vercel bundle (no test runner, no server, no OpenCV)
platform-prod = [
    { include-group = "service-core" },
    "asyncpg>=0.30.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "psycopg2-binary>=2.9.10",
    "PyJWT>=2.10.0",
    "python-multipart>=0.0.18",
    # Secret-strength estimation for JWT_SECRET. Dropbox's zxcvbn, the Python port
    # the upstream authors point at. MIT, ~880 KB, and it runs once at settings
    # load, so it costs the Vercel bundle size but no request latency.
    "zxcvbn>=4.5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "pillow>=12.3.0",
    "reportlab>=5.0.0",
    "supabase>=2.13.0",
]
# Nomicous platform API + Postgres + tests (deps only — repo is not installed as a package)
platform = [
    { include-group = "platform-prod" },
    { include-group = "test" },
    "alembic>=1.14.0",
    "opencv-python-headless>=4.8,<4.13",
    "pypdf>=6.13.2",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = false

# ADR 0004 requires the CPU-only Torch build: CUDA wheels dominate the download
# and are useless on a researcher's laptop. PyPI's macOS wheels are already CPU
# only, so the explicit index is pinned on the platforms where they are not.
#
# This pins *this repository's* lock. It does not travel with the published
# wheel - `tool.uv.sources` is ignored when a package is consumed from a
# registry, and no PEP 621 metadata can name an index. Measured against the
# published dependency set on 2026-08-04: a plain resolve on either Linux
# architecture drags 16 nvidia/triton wheels behind `torch`; on macOS arm64 and
# Windows it drags none. So the CPU pin has to be re-stated at install time,
# and the documented install command is
#
#     uv tool install nomicous-inference --torch-backend=cpu   # uv >= 0.10
#
# which resolves `torch==<v>+cpu` and zero CUDA wheels on every platform that
# has a wheel at all. The version floor is load-bearing: `uv tool install`
# grew the flag in 0.10, and 0.7.x accepts `UV_TORCH_BACKEND=cpu` from the
# environment and then ignores it. `tests/inference/integration/
# test_published_package.py` holds the resolution claim to a real per-platform
# resolve; nothing can hold the *user's* install command to anything.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.poe.tasks]
migrate = { shell = "cd ${NOMICOUS_APP_ROOT:-nomicous} && alembic -c infrastructure/alembic.ini upgrade head" }
serve = { shell = "cd ${NOMICOUS_APP_ROOT:-nomicous} && uvicorn backend.core.main:app --host 0.0.0.0 --port 8000 --workers 1" }
api = { sequence = ["migrate", "serve"] }
inference-helper = "python -m inference.helper"
# `--group test` is named explicitly on every task: the inference group carries
# no pytest, so omitting it silently falls back to whatever `pytest` is on PATH
# (unpinned) or fails outright.
test-fast = { shell = "uv run --group test --group platform --group inference pytest tests/nomicous/unit" }
test-integration = { shell = "uv run --group test --group platform --group inference pytest tests/nomicous -m integration" }
# The ml lane lives entirely under tests/inference now: the platform no longer
# runs a model, it hands a page to an agent that does.
test-ml = { shell = "uv run --group test --group platform --group inference pytest tests/inference -m ml" }
test-inference = { shell = "uv run --group test --group platform --group inference pytest tests/inference" }
test-hf = { shell = "uv run --group test --group inference pytest tests/hf" }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["nomicous", "."]
asyncio_mode = "auto"
testpaths = ["tests/nomicous", "tests/inference", "tests/hf"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "integration: requires Postgres",
    "ml: runs real BLLA/Calamari weights (slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["nomicous/backend", "inference"]
# CI and pre-commit invoke `ruff check .` so new top-level directories are linted
# by default instead of silently escaping an explicit path list. These trees are
# vendored, generated, or build output. (.venv, dist, and node_modules are
# already in ruff's default excludes.)
extend-exclude = [
    ".lgraph",
    # Retired subsystems, kept readable as they were. See archive/*/README.md.
    "archive",
    "data",
    "deploy/platform/inference",
    "deploy/platform/nomicous",
    "packaging/helper/build",
    "src/experiments",
]

[tool.ruff.lint]
# F: correctness. I: import sorting. UP: pyupgrade. B: bugbear. SIM: simplify.
select = ["F", "I", "UP", "B", "SIM"]

# ---------------------------------------------------------------------------
# Widening `select` and moving CI to `ruff check .` surfaced 519 pre-existing
# violations, none of them newly introduced. They are recorded here per tree and
# per rule so the new rules are enforced on all new and already-clean code
# instead of the whole ruleset being held back by legacy trees.
#
# This block is debt, not policy: each entry should be fixed and deleted. Do not
# add rules to it to make a new violation pass. Counts at time of writing:
#   src/model                  385   (also never linted before: F401/F403/F541/F841/F901)
#   nomicous/backend            54
#   tests                       41
#   inference                   12
#   scripts                      9
#   src/preprocessing_data       8
#   nomicous/infrastructure      4
#   src/hf                       4
#   packaging/helper             2
# ---------------------------------------------------------------------------
[tool.ruff.lint.per-file-ignores]
"inference/**" = ["B905", "I001", "SIM109", "SIM114", "UP037"]
"nomicous/backend/**" = ["B008", "B009", "I001", "SIM105", "UP037", "UP042"]
"nomicous/infrastructure/**" = ["I001"]
"packaging/helper/**" = ["I001"]
"scripts/**" = ["I001", "SIM112"]
"src/hf/**" = ["I001"]
"src/model/**" = [
    "B007", "B010", "B023", "B905",
    "F401", "F403", "F541", "F841", "F901",
    "I001",
    "SIM101", "SIM102", "SIM108", "SIM114", "SIM115", "SIM118", "SIM300", "SIM401",
    "UP006", "UP007", "UP008", "UP010", "UP015", "UP018", "UP031", "UP032",
    "UP035", "UP036", "UP045",
]
"src/preprocessing_data/**" = ["B905", "F401", "I001", "SIM102", "UP015"]
"tests/**" = ["B007", "B905", "F401", "I001", "SIM117"]

[tool.ruff.format]
quote-style = "double"
